<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Contact</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />

    <link rel="stylesheet" href="websitestyles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <nav>
      <div class="brand">
        <img
          src="https://i.postimg.cc/pLvrpT71/lovinghomeslogo.png"
          class="logo" alt="Loving Homes Logo"/>
        <div class="top-left-text">
          <a href="index.html">LOVING HOMES</a>
        </div>
      </div>

      <div class="nav-links">
        <a href="about-us.html">About us</a>
        <a href="facilities.html">Facilities</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="gallery.html">Gallery</a>
      </div>
    </nav>

    <main>
    <h1>Contact Us</h1>
      <div class="contact-outer-box">
      <div class="contact-grid">

      <section class="form-section">
        <h2>Send us a message</h2>
        <form class="contact-form">
          <label for="name">Name <span class="required">*</span></label>
          <input type="text" id="name" required placeholder="Your full name"> 

          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" required placeholder="bob28@gmail.com"> 

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Optional"> 

          <label for="message">Query <span class="required">*</span></label>
          <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea> 

          <button type="submit" class="submit-btn">SEND MESSAGE</button> 
        </form>
      </section>
          
      <section class="info-section"> 
        <h2>Our location</h2> 
        <p><strong>Address:</strong>135 Country Street, Hong Kong</p>
        <p><strong>Email:</strong> info@lovinghomes.com</p>
      </section>
      </div>
    </main>
    </body>
  </html>
